name: Deploy NOVA agent to LiveKit Cloud

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm you intend to deploy this code to NOVA production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nova-livekit-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy agent to LiveKit Cloud production
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: .
